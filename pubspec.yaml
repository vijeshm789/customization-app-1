name: mafatlal_visualizer
description: A Flutter application for visualizing fabric patterns on uniforms.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  carousel_slider: ^5.0.0
  image_picker: ^1.0.7
  share_plus: ^7.2.1
  url_launcher: ^6.2.4
  path_provider: ^2.1.2
  flutter_colorpicker: ^1.0.3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/banners/
    - assets/images/models/
    - assets/images/fabrics/
    - assets/images/logos/

  # Fonts commented out - add font files to assets/fonts/ and uncomment to use custom fonts
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
