<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Girl Model Base Layer - Non-customizable parts -->

  <!-- Head/Face -->
  <ellipse cx="100" cy="32" rx="25" ry="28" fill="#E8B89D"/>

  <!-- Neck -->
  <rect x="90" y="55" width="20" height="12" fill="#E8B89D"/>

  <!-- Hair (long pigtails/braids style) -->
  <path d="M75 22 Q75 5 100 5 Q125 5 125 22 L125 35 Q125 15 100 12 Q75 15 75 35 Z" fill="#3D2314"/>
  <!-- Left pigtail -->
  <path d="M72 35 Q65 50 60 90 Q58 110 62 130 L66 130 Q64 110 66 90 Q70 55 78 40 Z" fill="#3D2314"/>
  <!-- Right pigtail -->
  <path d="M128 35 Q135 50 140 90 Q142 110 138 130 L134 130 Q136 110 134 90 Q130 55 122 40 Z" fill="#3D2314"/>
  <!-- Hair ribbons -->
  <circle cx="63" cy="50" r="5" fill="#FF6B6B"/>
  <circle cx="137" cy="50" r="5" fill="#FF6B6B"/>

  <!-- Eyes -->
  <ellipse cx="90" cy="32" rx="4" ry="3" fill="#2C1810"/>
  <ellipse cx="110" cy="32" rx="4" ry="3" fill="#2C1810"/>
  <!-- Eyelashes -->
  <path d="M86 29 L84 27 M88 28 L87 26 M90 28 L90 26" stroke="#2C1810" stroke-width="0.5"/>
  <path d="M114 29 L116 27 M112 28 L113 26 M110 28 L110 26" stroke="#2C1810" stroke-width="0.5"/>

  <!-- Eyebrows -->
  <path d="M84 26 Q90 24 96 26" stroke="#3D2314" stroke-width="1" fill="none"/>
  <path d="M104 26 Q110 24 116 26" stroke="#3D2314" stroke-width="1" fill="none"/>

  <!-- Nose -->
  <path d="M100 35 L98 43 L102 43 Z" fill="#D4A088" opacity="0.5"/>

  <!-- Mouth (slight smile) -->
  <path d="M94 48 Q100 52 106 48" stroke="#C4756E" stroke-width="1.5" fill="none"/>
  <!-- Blush -->
  <ellipse cx="82" cy="42" rx="5" ry="3" fill="#FFADAD" opacity="0.4"/>
  <ellipse cx="118" cy="42" rx="5" ry="3" fill="#FFADAD" opacity="0.4"/>

  <!-- Ears -->
  <ellipse cx="75" cy="35" rx="4" ry="5" fill="#E8B89D"/>
  <ellipse cx="125" cy="35" rx="4" ry="5" fill="#E8B89D"/>

  <!-- Hands -->
  <ellipse cx="20" cy="140" rx="9" ry="10" fill="#E8B89D"/>
  <ellipse cx="180" cy="140" rx="9" ry="10" fill="#E8B89D"/>

  <!-- Legs (below skirt) -->
  <rect x="65" y="275" width="16" height="95" rx="5" fill="#E8B89D"/>
  <rect x="119" y="275" width="16" height="95" rx="5" fill="#E8B89D"/>

  <!-- Socks -->
  <rect x="63" y="340" width="20" height="35" rx="3" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="1"/>
  <rect x="117" y="340" width="20" height="35" rx="3" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="1"/>

  <!-- Shoes (Mary Jane style) -->
  <ellipse cx="73" cy="388" rx="18" ry="8" fill="#1A1A1A"/>
  <ellipse cx="127" cy="388" rx="18" ry="8" fill="#1A1A1A"/>
  <rect x="58" y="375" width="30" height="8" rx="3" fill="#1A1A1A"/>
  <rect x="112" y="375" width="30" height="8" rx="3" fill="#1A1A1A"/>
  <!-- Shoe straps -->
  <rect x="65" y="372" width="16" height="3" rx="1" fill="#1A1A1A"/>
  <rect x="119" y="372" width="16" height="3" rx="1" fill="#1A1A1A"/>
  <!-- Shoe buckles -->
  <circle cx="81" cy="373" r="2" fill="#C0A060"/>
  <circle cx="119" cy="373" r="2" fill="#C0A060"/>
</svg>
