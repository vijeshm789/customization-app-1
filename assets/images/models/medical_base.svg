<svg width="200" height="400" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Medical Model Base Layer - Non-customizable parts -->

  <!-- Head/Face -->
  <ellipse cx="100" cy="35" rx="26" ry="30" fill="#E8B89D"/>

  <!-- Neck -->
  <rect x="90" y="58" width="20" height="14" fill="#E8B89D"/>

  <!-- Hair (tied back style for medical professional) -->
  <path d="M74 25 Q74 8 100 8 Q126 8 126 25 L126 32 Q126 18 100 16 Q74 18 74 32 Z" fill="#3D2314"/>
  <ellipse cx="100" cy="12" rx="15" ry="8" fill="#3D2314"/>

  <!-- Eyes -->
  <ellipse cx="90" cy="35" rx="3.5" ry="2.5" fill="#2C1810"/>
  <ellipse cx="110" cy="35" rx="3.5" ry="2.5" fill="#2C1810"/>

  <!-- Glasses (optional medical look) -->
  <rect x="82" y="31" width="16" height="10" rx="2" fill="none" stroke="#666666" stroke-width="1"/>
  <rect x="102" y="31" width="16" height="10" rx="2" fill="none" stroke="#666666" stroke-width="1"/>
  <line x1="98" y1="36" x2="102" y2="36" stroke="#666666" stroke-width="1"/>

  <!-- Nose -->
  <path d="M100 38 L98 46 L102 46 Z" fill="#D4A088" opacity="0.5"/>

  <!-- Mouth -->
  <path d="M95 52 Q100 55 105 52" stroke="#C4756E" stroke-width="1.5" fill="none"/>

  <!-- Ears -->
  <ellipse cx="74" cy="36" rx="4" ry="6" fill="#E8B89D"/>
  <ellipse cx="126" cy="36" rx="4" ry="6" fill="#E8B89D"/>

  <!-- Stethoscope around neck -->
  <path d="M75 72 Q60 100 70 130 L72 130 Q62 100 77 74" stroke="#333333" stroke-width="3" fill="none"/>
  <path d="M125 72 Q140 100 130 130 L128 130 Q138 100 123 74" stroke="#333333" stroke-width="3" fill="none"/>
  <circle cx="100" cy="135" r="12" fill="#444444" stroke="#333333" stroke-width="2"/>
  <circle cx="100" cy="135" r="6" fill="#666666"/>

  <!-- Hands -->
  <ellipse cx="22" cy="175" rx="10" ry="11" fill="#E8B89D"/>
  <ellipse cx="178" cy="175" rx="10" ry="11" fill="#E8B89D"/>

  <!-- Medical Shoes (comfortable white) -->
  <ellipse cx="75" cy="390" rx="20" ry="8" fill="#F5F5F5" stroke="#DDDDDD" stroke-width="1"/>
  <ellipse cx="125" cy="390" rx="20" ry="8" fill="#F5F5F5" stroke="#DDDDDD" stroke-width="1"/>

  <!-- ID Badge -->
  <rect x="130" y="85" width="18" height="25" rx="2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <rect x="132" y="88" width="14" height="10" fill="#E0E0E0"/>
  <line x1="133" y1="102" x2="146" y2="102" stroke="#CCCCCC" stroke-width="1"/>
  <line x1="133" y1="106" x2="143" y2="106" stroke="#CCCCCC" stroke-width="1"/>
</svg>
